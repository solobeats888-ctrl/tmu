name: Build TMU (Mac + Windows)

on:
  push:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Compilar (Apple Silicon + Intel)
        run: |
          cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          cmake --build build --config Release -- -quiet

      - name: Firmar (ad-hoc)
        run: |
          A=build/TMU_artefacts/Release
          codesign --force --deep --sign - "$A/VST3/TMU.vst3"
          codesign --force --deep --sign - "$A/AU/TMU.component"
          lipo -info "$A/VST3/TMU.vst3/Contents/MacOS/TMU"

      - name: Paquetes del plugin
        run: |
          set -e
          A=build/TMU_artefacts/Release
          mkdir -p out stage/vst3 stage/au
          ditto "$A/VST3/TMU.vst3" stage/vst3/TMU.vst3
          ditto "$A/AU/TMU.component" stage/au/TMU.component
          chmod +x installer/scripts-vst3/* installer/scripts-au/*
          for b in vst3:TMU.vst3 au:TMU.component; do
            kind=${b%%:*}; bundle=${b#*:}
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0"><array><dict>' \
              '<key>BundleHasStrictIdentifier</key><false/>' \
              '<key>BundleIsRelocatable</key><false/>' \
              '<key>BundleIsVersionChecked</key><false/>' \
              '<key>BundleOverwriteAction</key><string>upgrade</string>' \
              "<key>RootRelativeBundlePath</key><string>$bundle</string>" \
              '</dict></array></plist>' > comp-$kind.plist
            plutil -lint comp-$kind.plist
          done
          pkgbuild --root stage/vst3 --component-plist comp-vst3.plist --identifier com.viszeversa.tmu.vst3 \
            --version 1.0.0 --install-location /Library/Audio/Plug-Ins/VST3 --scripts installer/scripts-vst3 out/TMU-VST3.pkg
          pkgbuild --root stage/au --component-plist comp-au.plist --identifier com.viszeversa.tmu.au \
            --version 1.0.0 --install-location /Library/Audio/Plug-Ins/Components --scripts installer/scripts-au out/TMU-AU.pkg
          # instalador con pantallas de bienvenida e instrucciones (installer/mac-resources)
          productbuild --distribution installer/mac-distribution.xml --package-path out --resources installer/mac-resources \
            out/TMU-Instalador-Mac.pkg
          rm out/TMU-VST3.pkg out/TMU-AU.pkg   # queda un solo instalador (solo el plugin, sin soundfonts)

      - name: Prueba del instalador
        run: |
          set -e
          sudo installer -pkg out/TMU-Instalador-Mac.pkg -target / -verboseR
          ls -la /Library/Audio/Plug-Ins/VST3/TMU.vst3 /Library/Audio/Plug-Ins/Components/TMU.component
          pkgutil --pkgs | grep viszeversa
          echo "INSTALADOR OK"

      - name: Validar Audio Unit (auval)
        run: |
          killall -9 AudioComponentRegistrar || true
          sleep 3
          auval -a | grep -i viszeversa || true
          auval -strict -v aumu Tmu1 Vszv

      - name: Validar VST3 (pluginval)
        continue-on-error: true
        run: |
          curl -sL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --skip-gui-tests --validate /Library/Audio/Plug-Ins/VST3/TMU.vst3

      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: TMU-mac
          path: out/

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Compilar (64 bits)
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release --target TMU_VST3

      - name: Instalador .exe (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DSourceDir=$PWD\build\TMU_artefacts\Release\VST3\TMU.vst3" "/O$PWD\out" installer\windows\TMU.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem out

      - name: Probar el instalador
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath "out\TMU-Instalador-Windows.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART"
          Get-ChildItem -Recurse "C:\Program Files\Common Files\VST3\TMU.vst3" | Select-Object -First 10
          if (-not (Test-Path "C:\Program Files\Common Files\VST3\TMU.vst3\Contents\x86_64-win\TMU.vst3")) { exit 1 }
          Write-Host "INSTALADOR OK"

      - name: Validar VST3 (pluginval)
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pv
          $p = Start-Process -Wait -PassThru -NoNewWindow -FilePath ".\pv\pluginval.exe" `
                 -ArgumentList '--strictness-level','5','--skip-gui-tests','--validate','"C:\Program Files\Common Files\VST3\TMU.vst3"' `
                 -RedirectStandardOutput pv-out.txt -RedirectStandardError pv-err.txt
          Get-Content pv-out.txt, pv-err.txt
          Write-Host "pluginval exit code: $($p.ExitCode)"
          # resumen visible en la pagina del workflow
          Get-Content pv-out.txt, pv-err.txt | Select-String -Pattern "FAIL|!!!|Error|error|crash|exception|Starting test|Completed|SUCCESS" | Select-Object -Last 25 | ForEach-Object { Write-Host "::warning::$($_.Line)" }
          Write-Host "::warning::pluginval exit code $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Subir resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TMU-Windows
          path: out/
