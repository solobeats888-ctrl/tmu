name: Build macOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Compilar (Apple Silicon + Intel)
        run: |
          cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          cmake --build build --config Release -- -quiet

      - name: Firmar (ad-hoc)
        run: |
          A=build/TMU_artefacts/Release
          codesign --force --deep --sign - "$A/VST3/TMU.vst3"
          codesign --force --deep --sign - "$A/AU/TMU.component"
          lipo -info "$A/VST3/TMU.vst3/Contents/MacOS/TMU"

      - name: Paquetes del plugin
        run: |
          set -e
          A=build/TMU_artefacts/Release
          mkdir -p out stage/vst3 stage/au
          ditto "$A/VST3/TMU.vst3" stage/vst3/TMU.vst3
          ditto "$A/AU/TMU.component" stage/au/TMU.component
          chmod +x installer/scripts-vst3/* installer/scripts-au/*
          for kind in vst3 au; do
            pkgbuild --analyze --root stage/$kind comp-$kind.plist
            /usr/libexec/PlistBuddy -c "Set :0:BundleIsRelocatable false" comp-$kind.plist
          done
          pkgbuild --root stage/vst3 --component-plist comp-vst3.plist --identifier com.chiru.tmu.vst3 \
            --version 1.0.0 --install-location /Library/Audio/Plug-Ins/VST3 --scripts installer/scripts-vst3 out/TMU-VST3.pkg
          pkgbuild --root stage/au --component-plist comp-au.plist --identifier com.chiru.tmu.au \
            --version 1.0.0 --install-location /Library/Audio/Plug-Ins/Components --scripts installer/scripts-au out/TMU-AU.pkg
          productbuild --package out/TMU-VST3.pkg --package out/TMU-AU.pkg out/TMU-Solo-Plugin.pkg

      - name: Prueba del instalador completo (con un soundfont de prueba)
        run: |
          set -e
          git clone -q --depth 1 https://github.com/hogliux/bomutils.git
          make -C bomutils -j4 >/dev/null
          python3 tools/make_test_sf2.py "test sine.sf2"
          printf "%s\t%s\n" "$PWD/test sine.sf2" "Test Sine.sf2" > test-list.tsv
          python3 tools/make_pkg.py all --out TMU-Test.pkg --sounds test-list.tsv \
            --component out/TMU-VST3.pkg --component out/TMU-AU.pkg --mkbom bomutils/build/bin/mkbom
          pkgutil --expand TMU-Test.pkg expanded
          lsbom expanded/TMU-SoundFonts.pkg/Bom
          sudo installer -pkg TMU-Test.pkg -target / -verboseR
          ls -la "/Library/Application Support/TMU/SoundFonts" /Library/Audio/Plug-Ins/VST3/TMU.vst3 /Library/Audio/Plug-Ins/Components/TMU.component
          cmp "test sine.sf2" "/Library/Application Support/TMU/SoundFonts/Test Sine.sf2"
          pkgutil --pkgs | grep chiru
          echo "INSTALADOR OK"

      - name: Validar Audio Unit (auval)
        run: |
          killall -9 AudioComponentRegistrar || true
          sleep 3
          auval -a | grep -i chiru || true
          auval -strict -v aumu Tmu1 Chru

      - name: Validar VST3 (pluginval)
        continue-on-error: true
        run: |
          curl -sL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --skip-gui-tests --validate /Library/Audio/Plug-Ins/VST3/TMU.vst3

      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: TMU-mac
          path: out/
