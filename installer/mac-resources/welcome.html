<h2>TMU — Sound Font Player</h2>
<p>Este instalador copia TMU (VST3 y Audio Unit) en la carpeta de plugins de tu Mac.</p>
<p>TMU es solo el plugin: no trae soundfonts. Después de instalar vas a poner tus <b>.sf2</b> en la carpeta <b>Música / TMU SoundFonts</b>.</p>
<p>Cerrá FL Studio antes de seguir.</p>
<p style="color:#888">por Viszeversza</p>
